services:
  - type: web
    name: outbid-city-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: outbid-city-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SUCCESS_URL
        value: https://outbidcity.lol/checkout/success?session_id={CHECKOUT_SESSION_ID}
      - key: STRIPE_CANCEL_URL
        value: https://outbidcity.lol/checkout/cancel
      - key: CORS_ORIGIN
        value: https://outbidcity.lol
      # Salt for the server-derived analytics visitor hash (SECURITY.md Threat 14). generateValue
      # lets Render create and store a random secret, so it never lives in the repo. It must be a
      # single stable value shared by every instance: if it were random per process, dedup would
      # reset on each cold start and each instance would recount the same visitor, re-introducing
      # the inflated impression/click counts the hash exists to prevent.
      - key: ANALYTICS_SALT
        generateValue: true
      # Render routes all traffic through its proxy, so trusting one hop of X-Forwarded-For is
      # correct here and is what makes rate limits per-client rather than global. Do NOT set this
      # where the service is also directly reachable — see SECURITY.md Threat 8/14.
      - key: TRUST_PROXY
        value: 1
      # Read-only routes are consumed by the SEO edge functions and crawlers from a small pool of
      # shared IPs, so they need a much larger budget than the strict write limit. See Threat 8.
      - key: READ_RATE_LIMIT_MAX
        value: 300
      # Analytics writes are high-frequency by nature and must not share the checkout budget.
      - key: ANALYTICS_RATE_LIMIT_MAX
        value: 120

databases:
  - name: outbid-city-db
    plan: free
